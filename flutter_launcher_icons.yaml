# Run `dart run flutter_launcher_icons` after changing the source images.
# The generator writes a 16x16 favicon and leaves the 180px Apple touch icon
# alone, so regenerate web/favicon.png (64x64),
# web/icons/apple-touch-icon-180.png, the padded maskable web icons, and the
# multi-size Windows ICO afterwards.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/penny_note_logo_2_cream.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#F6F0E5"
  adaptive_icon_foreground: "assets/icon/penny_note_logo_2_transparent.png"
  adaptive_icon_foreground_inset: 16
  web:
    generate: true
    image_path: "assets/icon/penny_note_logo_2_cream.png"
    background_color: "#F6F0E5"
    theme_color: "#A95D43"
  windows:
    generate: true
    image_path: "assets/icon/penny_note_logo_2_cream.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/penny_note_logo_2_transparent.png"
